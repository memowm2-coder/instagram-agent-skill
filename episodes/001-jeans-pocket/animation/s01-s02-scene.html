<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url(IBMPlexSansArabic-Bold.ttf);font-weight:700}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#1C1B19}
.scene{position:absolute;inset:0;overflow:hidden}
.L{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.L img,.L svg,.L div{position:absolute}
.sh{filter:drop-shadow(-8px 12px 9px rgba(0,0,0,.4))}
.w{position:relative!important;font-family:Plex;font-weight:700;font-size:74px;line-height:1;color:#1C1B19;direction:rtl;padding:10px 18px 18px;background:#FBF6EA;filter:drop-shadow(-4px 6px 4px rgba(0,0,0,.35))}
</style></head><body>
<div class="scene" id="s2">
 <div class="L" id="b_plate"><img src="l/s2_plate.png" style="left:0;top:0"></div>
 <div class="L" id="b_card"><img id="card2" class="sh" src="l/s2_card.png" style="left:335px;top:120px"></div>
 <div class="L" id="b_mar"><img id="mar2" class="sh" src="l/s2_maryam.png" style="left:0;top:0"></div>
 <div class="L" id="b_phone"><img id="phone2" class="sh" src="l/smartphone_unbranded_alpha.png" style="width:400px;left:0;top:0"></div>
 <div class="L" id="b_patch"><img id="patch2" src="l/s2_patch.png" style="left:0;top:0;filter:drop-shadow(0 -6px 6px rgba(0,0,0,.35))"></div>
 <div class="L" id="b_svg"><svg width="1920" height="1080" style="left:0;top:0" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g style="filter:drop-shadow(2px 3px 0 rgba(28,27,25,.85))" stroke="#F6F0E3"><path id="arrow2" d="M1060 160 C 960 120 860 160 800 260" stroke-width="9"/><path id="head2" d="M790 222 L800 262 L838 244" stroke-width="9"/></g>
  <g id="xs" stroke="#D2342B" stroke-width="44" style="transform-origin:590px 760px"><path id="x1" d="M480 650 L700 870"/><path id="x2" d="M700 650 L480 870"/></g>
 </svg></div>
</div>
<div class="scene" id="s1">
 <div class="L" id="d_plate"><img src="l/plate_clean.png" style="left:0;top:0"></div>
 <div class="L" id="d_mag"><img id="mag" src="l/magnifier.png" style="left:0;top:85px"></div>
 <div class="L" id="d_card"><img id="card" class="sh" src="l/back_card.png" style="left:315px;top:25px;width:860px;height:600px"></div>
 <div class="L" id="d_mar"><img id="mar" class="sh" src="l/maryam_paper_cutout_cream_outline.png" style="width:940px;left:270px;top:60px"></div>
 <div class="L" id="d_pocket"><img id="pocket" class="sh" src="l/pocket_front.png" style="left:0;top:0"></div>
 <div class="L" id="d_patch"><img id="patch" src="l/small_patch.png" style="left:0;top:0;filter:drop-shadow(0 -6px 6px rgba(0,0,0,.35))"></div>
 <div class="L" id="d_deco">
  <img id="qmark" class="sh" src="l/qmark.png" style="left:70px;top:80px">
  <img id="ticks_l" src="l/ticks_l.png" style="left:470px;top:140px">
  <img id="ticks_r" src="l/ticks_r.png" style="left:975px;top:320px">
  <div id="tcw" style="left:1060px;top:110px;width:720px;height:272px">
   <img class="sh" src="l/torn_paper_blank_alpha.png" style="left:0;top:0;width:720px">
   <div id="words" style="left:30px;top:22px;width:660px;height:230px;display:flex;flex-direction:row;flex-wrap:wrap;direction:rtl;justify-content:center;align-content:center;gap:10px 14px">
    <div class="w" id="w0">ليش</div><div class="w" id="w1">الجينز</div><div class="w" id="w2">فيه</div><div class="w" id="w3">جيب</div><div class="w" id="w4">صغير؟</div>
   </div>
  </div>
 </div>
 <div class="L" id="d_svg"><svg width="1920" height="1080" style="left:0;top:0;filter:drop-shadow(2px 3px 0 rgba(28,27,25,.85))" fill="none" stroke="#F6F0E3" stroke-linecap="round" stroke-linejoin="round">
  <path id="ring" d="M660 700 C 990 690 1020 770 990 870 C 960 975 420 985 345 900 C 285 830 330 712 660 700" stroke-width="7"/>
  <path id="arrow" d="M1400 480 C 1320 640 1180 720 1040 760" stroke-width="9"/>
  <path id="head" d="M1072 724 L1040 760 L1086 772" stroke-width="9"/>
 </svg></div>
</div>
<svg id="flap" width="1920" height="1080" style="position:absolute;left:0;top:0;pointer-events:none"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6EEDC"/><stop offset=".7" stop-color="#E2D3B4"/><stop offset="1" stop-color="#C9B48E"/></linearGradient></defs>
 <polygon id="fshadow" fill="rgba(0,0,0,.35)" style="filter:blur(14px)"/><polygon id="fpoly" fill="url(#fg)" stroke="#FFF8EA" stroke-width="3"/></svg>
<script>
const $=i=>document.getElementById(i);
const hash=(a,b)=>{let x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
const boil=(g,id,a=1.5,r=.4)=>{const k=Math.floor(g/4);return[(hash(k,id)-.5)*2*a,(hash(k,id+9)-.5)*2*a,(hash(k,id+17)-.5)*2*r]};
const S4=f=>f-(((f%4)+4)%4);
const keys=(f,ks)=>{let v=ks[0][1];for(const[k,x]of ks)if(f>=k)v=x;return v};
const ez=t=>{t=Math.max(0,Math.min(1,t));return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
function T(id,dx,dy,r=0,s=1,o){const e=$(id);e.style.transformOrigin=o||'center';e.style.transform=`translate(${dx}px,${dy}px) rotate(${r}deg) scale(${s})`}
function draw(id,t){const p=$(id);const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-Math.max(0,Math.min(1,t)))}
function cam(depth,cs,fx,fy,drift){for(const[id,d]of Object.entries(depth)){const s=1+(cs-1)*d;$(id).style.transform=`translate(${fx-fx*s+drift*(d-1)*8}px,${fy-fy*s}px) scale(${s})`}}
const WR=[-3,2,-2,2.5,-1.5];
function scene1(f){
 const g=S4(f);
 let cs=keys(f,[[0,1.035],[5,1.025],[10,1.015],[15,1.008],[20,1]]),fx=960,fy=540;
 if(f>=100){const t=ez((f-100)/50);cs=1+0.32*t;fx=960-300*t;fy=540+280*t}
 cam({d_plate:1,d_mag:1.05,d_card:1.03,d_mar:1.06,d_pocket:1.09,d_patch:1.1,d_deco:1.12,d_svg:1.1},cs,fx,fy,Math.sin(f/150*Math.PI)*6);
 const[mx,my,mr]=boil(g,3,2,.6);T('mag',mx,my,mr);
 const[cx,cy,cr]=boil(g,4,1,.3);T('card',cx,cy,-2+cr);
 // three distinct stop-motion positions with 2-3 degree tilt
 const y=keys(f,[[0,470],[21,300],[25,282],[33,95],[37,78],[45,-150],[49,-128],[53,-135]]);
 const r=keys(f,[[0,0],[21,-3],[25,-2.5],[33,2.5],[37,2],[45,-2],[49,-1.2],[53,-1]]);
 const[ax,ay,ar]=boil(g,1,1.5,.3);T('mar',ax,y+ay,r+ar);
 const[px,py]=boil(g,5,1.2,0);T('pocket',px,py);const[qx,qy]=boil(g,6,1.2,0);T('patch',qx,qy);
 const pop=at=>keys(f,[[0,0],[at,1.25],[at+4,0.95],[at+8,1]]);
 const[dx1,dy1,dr1]=boil(g,7);T('qmark',dx1,dy1,dr1,pop(24));T('ticks_l',0,0,0,pop(40));T('ticks_r',0,0,0,pop(56));
 const tx=keys(f,[[0,1200],[60,820],[64,420],[68,120],[72,-20],[76,0]]);const[tx2,ty2,tr2]=boil(g,8,1,.3);T('tcw',tx+tx2,ty2,3+tr2);
 // title words: separate paper cutouts, RTL order, stepped stamp-in
 for(let i=0;i<5;i++){const at=78+i*6;const s=keys(f,[[0,0],[at,1.3],[at+2,1.08],[at+4,.96],[at+6,1]]);const[wx,wy,wr]=boil(g,20+i,1,.4);
  $('w'+i).style.visibility=f>=at?'visible':'hidden';T('w'+i,wx,wy+keys(f,[[0,-30],[at,-18],[at+2,-4],[at+4,0]]),WR[i]+wr,s);}
 draw('ring',(f-96)/24);draw('arrow',(f-120)/10);draw('head',(f-130)/4);
}
function scene2(g){
 const h=S4(g);
 let cs=keys(g,[[-99,1.06],[0,1.045],[6,1.03],[12,1.015],[18,1]]),fx=960,fy=540;
 if(g>=100){const t=ez((g-100)/50);cs=1+0.18*t;fx=960-370*t;fy=540+220*t}
 cam({b_plate:1,b_card:1.03,b_mar:1.06,b_phone:1.1,b_patch:1.09,b_svg:1.1},cs,fx,fy,Math.sin(g/150*Math.PI)*6);
 const[cx,cy,cr]=boil(h,31,1,.3);T('card2',cx,cy,-3+cr);
 let my=0,mr=0;if(g>=56){my=keys(g,[[56,-22],[60,-8],[64,-14],[68,0]]);mr=keys(g,[[56,2],[64,-1],[68,0]])}
 const[ax,ay,ar]=boil(h,32,1.5,.3);T('mar2',ax,my+ay,mr+ar);
 const[qx,qy]=boil(h,33,1.2,0);T('patch2',qx,qy);
 const P=[[-99,[420,-1000,-10]],[20,[430,-820,-6]],[24,[420,-560,0]],[28,[400,-300,5]],[32,[392,-90,8]],[36,[390,-21,8]],[40,[390,12,9]],[44,[390,-16,6]],[48,[390,10,10]],[52,[390,-8,7]],
   [56,[330,-220,-6]],[60,[200,-420,-22]],[64,[60,-380,-46]],[68,[-30,-80,-70]],[72,[-60,150,-86]],[76,[-70,190,-90]]];
 let pv=P[0][1];for(const[k,v]of P)if(g>=k)pv=v;const[bx,by,br]=boil(h,34,1,.4);
 T('phone2',pv[0]+bx,pv[1]+by,pv[2]+br,1,'50% 50%');
 draw('arrow2',(g-20)/10);draw('head2',(g-30)/4);
 const xs=keys(g,[[0,0],[80,1.35],[82,1.1],[84,.96],[86,1]]);$('xs').style.transform=`rotate(-6deg) scale(${xs})`;$('xs').style.display=g>=80?'':'none';
 draw('x1',(g-80)/2);draw('x2',(g-82)/2);
}
// half-plane clip of the frame by x+y<=C, and the reflected flap
function clip(poly,keep){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const ia=keep(a),ib=keep(b);
 if(ia)out.push(a);if(ia!==ib){const fa=a[0]+a[1]-C,fb=b[0]+b[1]-C,t=fa/(fa-fb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return out}
let C=0;const RECT=[[0,0],[1920,0],[1920,1080],[0,1080]];
window.render=function(F){
 const p=ez((F-135)/33);C=(1920+1080)*(1-p)+2;
 const s1on=F<168, s2on=F>=135;
 $('s1').style.display=s1on?'block':'none';$('s2').style.display=s2on?'block':'none';
 if(s1on)scene1(F); if(s2on)scene2(F-150);
 if(p>0&&p<1){const kept=clip(RECT,q=>q[0]+q[1]<=C);const peel=clip(RECT,q=>q[0]+q[1]>C);
  $('s1').style.clipPath='polygon('+kept.map(q=>q[0]+'px '+q[1]+'px').join(',')+')';
  const fl=peel.map(q=>[C-q[1],C-q[0]]);const str=fl.map(q=>q.join(',')).join(' ');
  $('fpoly').setAttribute('points',str);$('fshadow').setAttribute('points',fl.map(q=>(q[0]+18)+','+(q[1]+22)).join(' '));$('flap').style.display='block';
 }else{$('s1').style.clipPath='none';$('flap').style.display='none'}
};
Promise.all([...document.images].map(i=>i.decode()).concat([document.fonts.ready])).then(()=>{render(0);document.body.dataset.ready=1});
</script></body></html>
